name: Import local project

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-local-project.yml"
      - ".repo-import-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download local Git bundle
        env:
          BUNDLE_URL: "https://slots-everyone-invite-pen.trycloudflare.com/treido-bg.bundle"
          EXPECTED_BYTES: "37764324"
        run: |
          set -euo pipefail
          curl --fail --location --retry 10 --retry-delay 2 "$BUNDLE_URL" --output /tmp/project.bundle
          test "$(stat -c%s /tmp/project.bundle)" = "$EXPECTED_BYTES"

      - name: Restore project commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: "581b9fa4bb5c308e7b321e1019e91e22799b2f62"
        run: |
          set -euo pipefail
          git clone --branch main /tmp/project.bundle /tmp/project
          cd /tmp/project
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/current
          if [ -d /tmp/current/.github/workflows ]; then
            mkdir -p .github
            rm -rf .github/workflows
            cp -a /tmp/current/.github/workflows .github/workflows
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows
            if ! git diff --cached --quiet; then
              git commit -m "chore: preserve repository workflows during import"
            fi
          fi

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main:main
